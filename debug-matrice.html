<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debug coordinate matrice</title>
    <style>
        :root {
            --bg: #f4efe8;
            --panel: rgba(255, 255, 255, 0.82);
            --line: rgba(58, 52, 45, 0.12);
            --text: #1f1b18;
            --muted: #5f574f;
            --accent: #7a8c6a;
            --accent-strong: #4d6143;
            --point: #d96c6c;
            --point-selected: #cf3a3a;
            --shadow: 0 18px 40px rgba(40, 30, 18, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            padding: 24px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 0 auto 20px;
            max-width: 1500px;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.5rem, 2vw, 2.2rem);
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            appearance: none;
            border: 1px solid var(--line);
            background: white;
            color: var(--text);
            border-radius: 999px;
            padding: 0.7rem 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.06);
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1.75fr) minmax(300px, 0.85fr);
            gap: 20px;
            max-width: 1500px;
            margin: 0 auto;
        }

        .panel {
            background: var(--panel);
            backdrop-filter: blur(8px);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: var(--shadow);
        }

        .canvas-panel {
            padding: 16px;
        }

        .canvas-frame {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 18px;
            overflow: hidden;
            background: #f7f4ef;
            border: 1px solid var(--line);
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
            background: #f4efe8;
            cursor: crosshair;
        }

        .sidebar {
            padding: 18px 18px 8px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .selected-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background: rgba(122, 140, 106, 0.1);
            border: 1px solid rgba(122, 140, 106, 0.2);
            border-radius: 12px;
            font-weight: 600;
        }

        .selected-box span {
            color: var(--muted);
        }

        .selected-box strong {
            font-size: 1.05rem;
        }

        .coords {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.82rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
        }

        input[type="number"] {
            width: 100%;
            padding: 0.7rem 0.8rem;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: white;
            color: var(--text);
            font: inherit;
        }

        .coord-list {
            border: 1px solid var(--line);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.75);
            max-height: 500px;
            overflow: auto;
        }

        .coord-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 10px;
            border-bottom: 1px solid var(--line);
            cursor: pointer;
        }

        .coord-item:last-child {
            border-bottom: none;
        }

        .coord-item.is-selected {
            background: rgba(122, 140, 106, 0.14);
        }

        .coord-item .key {
            font-weight: 700;
            color: var(--text);
        }

        .coord-item .value {
            color: var(--muted);
            font-size: 0.85rem;
        }

        pre {
            margin: 0;
            white-space: pre-wrap;
            background: rgba(26, 27, 31, 0.96);
            color: #edf6e9;
            border-radius: 12px;
            padding: 14px;
            font-size: 0.82rem;
            line-height: 1.5;
            overflow: auto;
            min-height: 220px;
        }

        .hint {
            margin: 0;
            line-height: 1.5;
            color: var(--muted);
        }

        @media (max-width: 980px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="toolbar">
        <h1>Debug coordinate matrice</h1>
        <div class="actions">
            <button id="resetCoords" type="button">Reset valori</button>
            <button id="copyCoords" type="button">Copia JSON</button>
        </div>
    </div>

    <main class="layout">
        <section class="panel canvas-panel">
            <div class="canvas-frame">
                <svg id="debugSvg" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg"
                    aria-label="Area di debug della matrice">
                    <image href="images/matrice.jpeg" x="0" y="0" width="1000" height="1000"
                        preserveAspectRatio="xMidYMid meet" />
                    <g id="logoOverlay" opacity="0.3" pointer-events="none">
                        <image href="images/logo-no-sfondo.png" x="325" y="325" width="350" height="350"
                            preserveAspectRatio="xMidYMid meet" />
                    </g>
                    <g id="pointsLayer"></g>
                </svg>
            </div>
        </section>

        <aside class="panel sidebar">
            <div class="selected-box">
                <span>Selezionato</span>
                <strong id="selectedKey">eta0</strong>
            </div>

            <div class="coords">
                <div class="field">
                    <label for="coordX">X</label>
                    <input id="coordX" type="number" step="1" min="0" max="1000" />
                </div>
                <div class="field">
                    <label for="coordY">Y</label>
                    <input id="coordY" type="number" step="1" min="0" max="1000" />
                </div>
            </div>

            <p class="hint">
                Clicca un punto per selezionarlo. Trascinalo per regolare la posizione esatta. I valori aggiornati
                compaiono subito nel JSON qui sotto.
            </p>

            <div id="coordList" class="coord-list" aria-live="polite"></div>

            <pre id="jsonOutput"></pre>
        </aside>
    </main>

    <script>
        const PROGNOSI_SEGMENTI = [
            { decade: "0_10", from: "eta0", to: "eta10" },
            { decade: "10_20", from: "eta10", to: "eta20" },
            { decade: "20_30", from: "eta20", to: "eta30" },
            { decade: "30_40", from: "eta30", to: "eta40" },
            { decade: "40_50", from: "eta40", to: "eta50" },
            { decade: "50_60", from: "eta50", to: "eta60" },
            { decade: "60_70", from: "eta60", to: "eta70" },
            { decade: "70_0", from: "eta70", to: "eta0" },
        ];

        const PROGNOSI_PERIODI = ["a", "b", "c", "d", "e", "f", "g"];

        const DEFAULT_COORDS = {
            eta0: { x: 138, y: 502, fontSize: 40 },
            eta10: { x: 244, y: 244, fontSize: 40 },
            eta20: { x: 502, y: 138, fontSize: 40 },
            eta30: { x: 759, y: 244, fontSize: 40 },
            eta40: { x: 865, y: 502, fontSize: 40 },
            eta50: { x: 759, y: 759, fontSize: 40 },
            eta60: { x: 502, y: 865, fontSize: 40 },
            eta70: { x: 244, y: 759, fontSize: 40 },

            centro: { x: 502, y: 502, fontSize: 50 },

            top1: { x: 490, y: 210, fontSize: 30 },
            top2: { x: 490, y: 265, fontSize: 20 },
            top3: { x: 490, y: 368, fontSize: 20 },

            left1: { x: 175, y: 518, fontSize: 30 },
            left2: { x: 230, y: 518, fontSize: 20 },
            left3: { x: 335, y: 518, fontSize: 20 },

            right1: { x: 745, y: 518, fontSize: 20 },
            right2: { x: 795, y: 518, fontSize: 30 },
            right3: { x: 565, y: 518, fontSize: 30 },
            right4: { x: 620, y: 518, fontSize: 20 },

            bottom1: { x: 490, y: 775, fontSize: 20 },
            bottom2: { x: 490, y: 830, fontSize: 30 },

            upLeft1: { x: 270, y: 300, fontSize: 30 },
            upLeft2: { x: 305, y: 340, fontSize: 20 },
            upRight1: { x: 705, y: 300, fontSize: 30 },
            upRight2: { x: 670, y: 340, fontSize: 20 },

            downLeft2: { x: 305, y: 705, fontSize: 20 },
            downLeft3: { x: 270, y: 740, fontSize: 30 },

            downRight1: { x: 665, y: 700, fontSize: 20 },
            downRight2: { x: 705, y: 735, fontSize: 30 },

            moneyLove1: { x: 608, y: 638, fontSize: 20 },
            moneyLove2: { x: 668, y: 625, fontSize: 20 },
            moneyLove3: { x: 588, y: 702, fontSize: 20 },

            leftSide1: { x: 230, y: 665, fontSize: 20 },
            leftSide2: { x: 230, y: 700, fontSize: 20 },
        };

        function calcolaPosizionePrognosiSegmento(fromKey, toKey, indice) {
            const from = DEFAULT_COORDS[fromKey];
            const to = DEFAULT_COORDS[toKey];
            const centro = DEFAULT_COORDS.centro;

            if (!from || !to || !centro) {
                return null;
            }

            // Trasla tutto il blocco di 7 punti verso la fine del segmento,
            // lasciando un margine simmetrico prima del primo e dopo l'ultimo.
            const marginStart = 0.21;
            const marginEnd = 0.78;
            const t =
                marginStart +
                (indice / (PROGNOSI_PERIODI.length - 1)) * (marginEnd - marginStart);
            const baseX = from.x + (to.x - from.x) * t;
            const baseY = from.y + (to.y - from.y) * t;
            const vecX = baseX - centro.x;
            const vecY = baseY - centro.y;
            const modulo = Math.hypot(vecX, vecY) || 1;
            const offset = 53;

            return {
                x: baseX + (vecX / modulo) * offset,
                y: baseY + (vecY / modulo) * offset,
                fontSize: 13,
            };
        }

        function buildCalculatedCoords() {
            const result = Object.fromEntries(
                Object.entries(DEFAULT_COORDS).map(([key, value]) => [key, { ...value }])
            );

            PROGNOSI_SEGMENTI.forEach((segmento) => {
                PROGNOSI_PERIODI.forEach((periodo, indice) => {
                    const key = `prog${segmento.decade}_${periodo}`;
                    const pos = calcolaPosizionePrognosiSegmento(segmento.from, segmento.to, indice);
                    if (pos) {
                        result[key] = { ...pos };
                    }
                });
            });

            return result;
        }

        const CURRENT_COORDS = buildCalculatedCoords();

        function riduciA22(numero) {
            let n = Math.abs(Number(numero)) || 0;
            if (n === 0) return 22;

            while (n > 22) {
                n = String(n)
                    .split("")
                    .reduce((acc, c) => acc + Number(c), 0);
            }

            return n === 0 ? 22 : n;
        }

        function sommaCifre(numero) {
            return String(Math.abs(Number(numero)) || 0)
                .split("")
                .reduce((acc, c) => acc + Number(c), 0);
        }

        function scomponiData(dataStr) {
            const [anno, mese, giorno] = dataStr.split("-").map(Number);
            return { giorno, mese, anno };
        }

        function calcolaPrognosiVita(valoriDecadi) {
            const prognosi = {};
            const segments = [
                { decade: "0_10", from: "eta0", to: "eta10" },
                { decade: "10_20", from: "eta10", to: "eta20" },
                { decade: "20_30", from: "eta20", to: "eta30" },
                { decade: "30_40", from: "eta30", to: "eta40" },
                { decade: "40_50", from: "eta40", to: "eta50" },
                { decade: "50_60", from: "eta50", to: "eta60" },
                { decade: "60_70", from: "eta60", to: "eta70" },
                { decade: "70_0", from: "eta70", to: "eta0" },
            ];

            segments.forEach((segmento) => {
                const F = valoriDecadi[segmento.from];
                const B = valoriDecadi[segmento.to];

                const d = riduciA22(F + B);
                const b = riduciA22(F + d);
                const a = riduciA22(F + b);
                const c = riduciA22(b + d);
                const f = riduciA22(d + B);
                const e = riduciA22(d + f);
                const g = riduciA22(f + B);

                const inOrdine = { a, b, c, d, e, f, g };
                PROGNOSI_PERIODI.forEach((periodo) => {
                    const key = `prog${segmento.decade}_${periodo}`;
                    prognosi[key] = inOrdine[periodo];
                });
            });

            return prognosi;
        }

        function calcolaMatrice(nome, dataNascita) {
            const { giorno, mese, anno } = scomponiData(dataNascita);

            const eta0 = riduciA22(giorno);
            const eta20 = riduciA22(mese);
            const eta40 = riduciA22(sommaCifre(anno));
            const eta10 = riduciA22(eta0 + eta20);
            const eta30 = riduciA22(eta20 + eta40);
            const eta60 = riduciA22(eta0 + eta20 + eta40);
            const eta50 = riduciA22(eta40 + eta60);
            const eta70 = riduciA22(eta60 + eta0);
            const centro = riduciA22(eta0 + eta20 + eta40 + eta60);

            const top2 = riduciA22(centro + eta20);
            const top1 = riduciA22(eta20 + top2);
            const top3 = riduciA22(top2 + centro);

            const left2 = riduciA22(eta0 + centro);
            const left1 = riduciA22(left2 + eta0);
            const left3 = riduciA22(left2 + centro);

            const right1 = riduciA22(eta40 + centro);
            const right2 = riduciA22(right1 + eta40);
            const right3 = riduciA22(eta10 + eta30 + eta50 + eta70);
            const right4 = riduciA22(right3 + centro);

            const bottom1 = riduciA22(eta60 + centro);
            const bottom2 = riduciA22(bottom1 + eta60);

            const upLeft1 = riduciA22(top1 + left1);
            const upLeft2 = riduciA22(top2 + left2);
            const upRight2 = riduciA22(eta30 + right3);
            const upRight1 = riduciA22(upRight2 + eta30);

            const downLeft2 = riduciA22(right3 + eta70);
            const downLeft3 = riduciA22(downLeft2 + eta70);

            const downRight1 = riduciA22(eta50 + right3);
            const downRight2 = riduciA22(downRight1 + eta50);

            const moneyLove1 = riduciA22(bottom1 + right1);
            const moneyLove2 = riduciA22(moneyLove1 + right1);
            const moneyLove3 = riduciA22(moneyLove1 + bottom1);

            const prognosiVita = calcolaPrognosiVita({
                eta0,
                eta10,
                eta20,
                eta30,
                eta40,
                eta50,
                eta60,
                eta70,
            });

            return {
                eta0,
                eta10,
                eta20,
                eta30,
                eta40,
                eta50,
                eta60,
                eta70,
                centro,
                top1,
                top2,
                top3,
                left1,
                left2,
                left3,
                right1,
                right2,
                right3,
                right4,
                bottom1,
                bottom2,
                upLeft1,
                upLeft2,
                upRight1,
                upRight2,
                downLeft2,
                downLeft3,
                downRight1,
                downRight2,
                moneyLove1,
                moneyLove2,
                moneyLove3,
                ...prognosiVita,
            };
        }

        const SAMPLE_RESULTS = calcolaMatrice("Debug", "1990-05-12");

        const svg = document.getElementById("debugSvg");
        const pointsLayer = document.getElementById("pointsLayer");
        const coordList = document.getElementById("coordList");
        const jsonOutput = document.getElementById("jsonOutput");
        const selectedKeyEl = document.getElementById("selectedKey");
        const coordXEl = document.getElementById("coordX");
        const coordYEl = document.getElementById("coordY");

        let selectedKey = "eta0";
        let draggingKey = null;

        function clamp(value, min, max) {
            return Math.min(max, Math.max(min, value));
        }

        function getSvgPoint(event) {
            const rect = svg.getBoundingClientRect();
            const x = ((event.clientX - rect.left) / rect.width) * 1000;
            const y = ((event.clientY - rect.top) / rect.height) * 1000;
            return {
                x: clamp(x, 0, 1000),
                y: clamp(y, 0, 1000),
            };
        }

        function renderJson() {
            const ordered = Object.fromEntries(
                Object.entries(CURRENT_COORDS).map(([key, value]) => [
                    key,
                    { x: Math.round(value.x), y: Math.round(value.y), fontSize: value.fontSize },
                ])
            );

            jsonOutput.textContent = JSON.stringify(ordered, null, 2);
        }

        function updateForm() {
            const point = CURRENT_COORDS[selectedKey];
            selectedKeyEl.textContent = selectedKey;
            coordXEl.value = Math.round(point.x);
            coordYEl.value = Math.round(point.y);
        }

        function renderList() {
            coordList.innerHTML = "";

            Object.entries(CURRENT_COORDS).forEach(([key, value]) => {
                const item = document.createElement("button");
                item.type = "button";
                item.className = "coord-item" + (key === selectedKey ? " is-selected" : "");
                item.innerHTML = `
            <span class="key">${key}</span>
            <span class="value">${Math.round(value.x)}, ${Math.round(value.y)}</span>
          `;

                item.addEventListener("click", () => {
                    selectedKey = key;
                    updateForm();
                    renderList();
                    renderPoints();
                });

                coordList.appendChild(item);
            });
        }

        function renderReferenceNumbers() {
            const numberLayer = document.getElementById("numberLayer") || document.createElementNS("http://www.w3.org/2000/svg", "g");
            numberLayer.setAttribute("id", "numberLayer");
            numberLayer.innerHTML = "";
            svg.appendChild(numberLayer);

            Object.entries(SAMPLE_RESULTS).forEach(([key, value]) => {
                const pos = CURRENT_COORDS[key];
                if (!pos) return;

                const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                text.setAttribute("x", pos.x);
                text.setAttribute("y", pos.y);
                text.setAttribute("text-anchor", "middle");
                text.setAttribute("dominant-baseline", "middle");
                text.setAttribute("font-size", String(pos.fontSize || 16));
                text.setAttribute("font-weight", "700");
                text.setAttribute("fill", key === selectedKey ? "#4d6143" : "#1d1d1d");
                text.setAttribute("font-family", "'Manrope', 'Segoe UI', sans-serif");
                text.textContent = String(value);
                numberLayer.appendChild(text);
            });
        }

        function renderPoints() {
            pointsLayer.innerHTML = "";

            Object.entries(CURRENT_COORDS).forEach(([key, value]) => {
                const isSelected = key === selectedKey;
                const ringRadius = isSelected ? 42 : 32;

                const guideRing = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                guideRing.setAttribute("cx", value.x);
                guideRing.setAttribute("cy", value.y);
                guideRing.setAttribute("r", ringRadius);
                guideRing.setAttribute("fill", "none");
                guideRing.setAttribute("stroke", isSelected ? "rgba(207, 58, 58, 0.9)" : "rgba(122, 140, 106, 0.5)");
                guideRing.setAttribute("stroke-width", isSelected ? 2.2 : 1.1);
                guideRing.setAttribute("stroke-dasharray", isSelected ? "7 6" : "3 8");
                guideRing.setAttribute("pointer-events", "none");
                pointsLayer.appendChild(guideRing);

                const verticalLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
                verticalLine.setAttribute("x1", value.x);
                verticalLine.setAttribute("y1", value.y - 16);
                verticalLine.setAttribute("x2", value.x);
                verticalLine.setAttribute("y2", value.y + 16);
                verticalLine.setAttribute("stroke", isSelected ? "#cf3a3a" : "rgba(77, 97, 67, 0.7)");
                verticalLine.setAttribute("stroke-width", isSelected ? 1.8 : 1.2);
                verticalLine.setAttribute("pointer-events", "none");
                pointsLayer.appendChild(verticalLine);

                const horizontalLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
                horizontalLine.setAttribute("x1", value.x - 16);
                horizontalLine.setAttribute("y1", value.y);
                horizontalLine.setAttribute("x2", value.x + 16);
                horizontalLine.setAttribute("y2", value.y);
                horizontalLine.setAttribute("stroke", isSelected ? "#cf3a3a" : "rgba(77, 97, 67, 0.7)");
                horizontalLine.setAttribute("stroke-width", isSelected ? 1.8 : 1.2);
                horizontalLine.setAttribute("pointer-events", "none");
                pointsLayer.appendChild(horizontalLine);

                const centerDot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                centerDot.setAttribute("cx", value.x);
                centerDot.setAttribute("cy", value.y);
                centerDot.setAttribute("r", isSelected ? 5.5 : 4);
                centerDot.setAttribute("fill", isSelected ? "#cf3a3a" : "#d96c6c");
                centerDot.setAttribute("stroke", "#fff");
                centerDot.setAttribute("stroke-width", "1.5");
                centerDot.setAttribute("pointer-events", "none");
                pointsLayer.appendChild(centerDot);

                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("cx", value.x);
                circle.setAttribute("cy", value.y);
                circle.setAttribute("r", isSelected ? 8 : 6);
                circle.setAttribute("fill", isSelected ? "#cf3a3a" : "#d96c6c");
                circle.setAttribute("stroke", isSelected ? "#581919" : "rgba(77, 97, 67, 0.8)");
                circle.setAttribute("stroke-width", isSelected ? 2.5 : 1.5);
                circle.setAttribute("opacity", "0.95");
                circle.style.cursor = "pointer";

                circle.addEventListener("pointerdown", (event) => {
                    event.stopPropagation();
                    selectedKey = key;
                    draggingKey = key;
                    updateForm();
                    renderList();
                    renderPoints();
                    // renderReferenceNumbers();
                });

                pointsLayer.appendChild(circle);

                const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
                label.setAttribute("x", Number(value.x) + 12);
                label.setAttribute("y", Number(value.y) - 12);
                label.setAttribute("font-size", isSelected ? 14 : 11);
                label.setAttribute("font-weight", "700");
                label.setAttribute("fill", isSelected ? "#2d2d2d" : "#434343");
                label.textContent = key;
                pointsLayer.appendChild(label);
            });

            // renderReferenceNumbers();
        }

        function setSelectedPointFromInputs() {
            const point = CURRENT_COORDS[selectedKey];
            if (!point) return;
            point.x = clamp(Number(coordXEl.value) || point.x, 0, 1000);
            point.y = clamp(Number(coordYEl.value) || point.y, 0, 1000);
            renderList();
            renderPoints();
            renderJson();
        }

        coordXEl.addEventListener("change", setSelectedPointFromInputs);
        coordYEl.addEventListener("change", setSelectedPointFromInputs);

        svg.addEventListener("pointerdown", (event) => {
            const point = getSvgPoint(event);
            const nearest = Object.entries(CURRENT_COORDS).find(([key, value]) => {
                const dist = Math.hypot(value.x - point.x, value.y - point.y);
                return dist <= 18;
            });

            if (nearest) {
                selectedKey = nearest[0];
                draggingKey = selectedKey;
                updateForm();
                renderList();
                renderPoints();
                return;
            }

            if (selectedKey) {
                CURRENT_COORDS[selectedKey].x = point.x;
                CURRENT_COORDS[selectedKey].y = point.y;
                updateForm();
                renderList();
                renderPoints();
                renderJson();
            }
        });

        svg.addEventListener("pointermove", (event) => {
            if (!draggingKey) return;
            const point = getSvgPoint(event);
            CURRENT_COORDS[draggingKey].x = point.x;
            CURRENT_COORDS[draggingKey].y = point.y;
            updateForm();
            renderList();
            renderPoints();
            renderJson();
        });

        window.addEventListener("pointerup", () => {
            draggingKey = null;
        });

        document.getElementById("resetCoords").addEventListener("click", () => {
            const freshCoords = buildCalculatedCoords();
            Object.keys(CURRENT_COORDS).forEach((key) => {
                const original = freshCoords[key];
                if (!original) return;
                CURRENT_COORDS[key].x = original.x;
                CURRENT_COORDS[key].y = original.y;
                CURRENT_COORDS[key].fontSize = original.fontSize;
            });

            selectedKey = "eta0";
            updateForm();
            renderList();
            renderPoints();
            renderJson();
        });

        document.getElementById("copyCoords").addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(jsonOutput.textContent);
                document.getElementById("copyCoords").textContent = "JSON copiato";
                window.setTimeout(() => {
                    document.getElementById("copyCoords").textContent = "Copia JSON";
                }, 1200);
            } catch (error) {
                document.getElementById("copyCoords").textContent = "Copia non disponibile";
            }
        });

        updateForm();
        renderList();
        renderPoints();
        renderJson();
    </script>
</body>

</html>
